apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-pgsql.fullname" . }}-active
  labels:
    {{- include "three-tier-pgsql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "three-tier-pgsql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-pgsql.fullname" . }}-preview
  labels:
    {{- include "three-tier-pgsql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "three-tier-pgsql.selectorLabels" . | nindent 4 }}
