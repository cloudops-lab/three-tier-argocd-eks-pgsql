apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    {{- include "three-tier-pgsql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database .Values.database.host }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_READ_HOST: {{ default .Values.database.host .Values.database.readHost | quote }}
  DB_PORT: {{ default "5432" .Values.database.port | quote }}
  DB_NAME: {{ default "" .Values.database.name | quote }}
  DB_USER: {{ default "" .Values.database.user | quote }}
  DB_PASSWORD: {{ default "" .Values.database.password | quote }}
  {{- else }}
  DB_HOST: ""
  DB_READ_HOST: ""
  DB_PORT: "5432"
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""
  {{- end }}
